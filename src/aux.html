<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' blob: data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>DJ Visualizer — Uscita</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    #aux-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
  </style>
</head>
<body class="hide-cursor">
  <canvas id="gl"></canvas>
  <img id="aux-image" alt="" />

  <!-- Same ticker structure (and CSS) as the main output -->
  <div id="ticker"><div id="ticker-track"><span class="tick-copy"></span><span class="tick-copy"></span></div></div>
  <div id="side-text">
    <div class="side-col left"><div class="side-track"><span class="side-copy"></span><span class="side-copy"></span></div></div>
    <div class="side-col right"><div class="side-track"><span class="side-copy"></span><span class="side-copy"></span></div></div>
  </div>

  <script src="shaders.js"></script>
  <script src="effects.js"></script>
  <script src="fluid.js"></script>
  <script src="visualizer.js"></script>
  <script src="aux.js"></script>
</body>
</html>
