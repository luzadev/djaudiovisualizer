<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' blob: data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>DJ Visualizer — Uscita</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
    #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
    #aux-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
    /* Overlay text: static (centered) or scrolling marquee, over any mode */
    #aux-text {
      position: absolute; left: 0; width: 100%;
      display: none; overflow: hidden; white-space: nowrap;
      font-family: -apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif;
      text-shadow: 0 0 18px rgba(0,0,0,0.9), 0 2px 6px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #aux-text.static { text-align: center; }
    #aux-text.scroll #aux-text-inner {
      display: inline-block; padding-left: 100vw;
      animation: auxscroll var(--aux-scroll-dur, 14s) linear infinite;
    }
    @keyframes auxscroll {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <img id="aux-image" alt="" />
  <div id="aux-text"><span id="aux-text-inner"></span></div>
  <script src="shaders.js"></script>
  <script src="effects.js"></script>
  <script src="fluid.js"></script>
  <script src="visualizer.js"></script>
  <script src="aux.js"></script>
</body>
</html>
